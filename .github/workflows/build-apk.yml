name: Build APK

# Build the Android app in the cloud - no setup or coding needed. In your fork of the repository:
# Actions -> "Build APK" -> "Run workflow". When it finishes, download the APK from the run's
# "Artifacts" section.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./build.sh apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranicWords-debug-apk
          path: build/QuranicWords-debug.apk
          retention-days: 30
