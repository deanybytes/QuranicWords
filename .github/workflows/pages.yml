name: Deploy website

# Publishes the static site to GitHub Pages at https://deanybytes.github.io/QuranicWords/ from the
# deanybytes/QuranicWords fork (a GitHub Pages project site, no custom domain). The code lives in
# rmrashahriar/QuranicWords; its "Sync deanybytes fork" workflow pushes every change to the fork,
# and that push runs this deploy. In any other repo the job is skipped.
# Only what tools/web/build_site.sh copies is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    if: github.repository_owner == 'deanybytes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke tests
        run: node tools/web/smoke_test.mjs
      - name: Assemble site
        run: tools/web/build_site.sh build/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
