name: Web CI

on:
  push:
    branches: [main]
    paths: ["index.html", "js/**", "css/**", "sw.js", "manifest.json", "CNAME", "tools/web/**", "quran-words/**", "quran-roots/**", "robots.txt", "sitemap*.xml", ".github/workflows/web-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["index.html", "js/**", "css/**", "sw.js", "manifest.json", "CNAME", "tools/web/**", "quran-words/**", "quran-roots/**", "robots.txt", "sitemap*.xml", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  smoke:
    name: Module smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke tests (SRS, quiz, i18n parity, escaping, routing)
        run: node tools/web/smoke_test.mjs
      - name: The site assembles
        run: tools/web/build_site.sh build/site && test -f build/site/CNAME && test -f build/site/404.html
